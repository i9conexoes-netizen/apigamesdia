<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Editor Mobile</title>
    <style>
        /* Reset e Base */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0a0a0a; color: white; margin: 0; 
            display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
        }
        .container { width: 100%; max-width: 500px; padding: 20px; text-align: center; }

        /* Header */
        .logo-main { width: 80px; height: auto; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(0,123,255,0.5)); }
        h2 { margin: 10px 0; font-size: 1.5rem; }
        p { color: #888; font-size: 0.9rem; }

        /* Upload */
        .upload-wrapper {
            background: #161616; padding: 30px 20px; border-radius: 20px;
            border: 2px dashed #333; margin-bottom: 20px;
        }
        .label-btn { 
            background: #007bff; color: white; padding: 16px 20px; 
            border-radius: 12px; cursor: pointer; font-weight: bold; display: block; 
        }
        input[type="file"] { display: none; }

        /* Botão Enviar Geral */
        #sendAllContainer {
            display: none;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        .send-all-btn {
            background: #5865F2; color: white; width: 100%; padding: 18px;
            border-radius: 15px; border: none; font-weight: bold; font-size: 1rem;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); cursor: pointer;
            transition: transform 0.2s;
        }
        .send-all-btn:active { transform: scale(0.98); }

        /* Resultados */
        .result-item { background: #161616; padding: 15px; border-radius: 15px; margin-bottom: 25px; }
        img.output-img { width: 100%; border-radius: 10px; display: block; }

        .save-btn { 
            background: #25d366; color: white; padding: 12px 0; border-radius: 10px; 
            font-weight: bold; display: block; margin-top: 15px;
            font-size: 0.9rem; border: none; width: 100%; cursor: pointer;
            text-decoration: none;
        }
        
        .status-text { margin: 15px 0; font-size: 0.9rem; color: #00d4ff; }
        .hint { font-size: 0.7rem; color: #555; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://i.imgur.com/lhhqACi.png" class="logo-main">
        <h2>Sports Editor</h2>
        <p>A logo da Inove é aplicada automaticamente.</p>
    </div>

    <div class="upload-wrapper">
        <label for="imageInput" class="label-btn">SELECIONAR CARTAZES</label>
        <input type="file" id="imageInput" accept="image/*" multiple>
        <div id="status" class="status-text">Nenhum arquivo selecionado</div>
    </div>

    <div id="sendAllContainer">
        <button id="sendAllBtn" class="send-all-btn">ENVIAR TUDO AO DISCORD</button>
    </div>

    <div id="resultContainer"></div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const resultContainer = document.getElementById('resultContainer');
    const status = document.getElementById('status');
    const sendAllContainer = document.getElementById('sendAllContainer');
    const sendAllBtn = document.getElementById('sendAllBtn');
    
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1496868823637430405/S4JcU4341ORrWEJXKIfuiQ4yGUQUZn_RyZJtxKrbQc56AMTakNufby1vAohkP-Ht24-y";

    let processedImages = [];

    const userLogo = new Image();
    userLogo.crossOrigin = "anonymous"; 
    userLogo.src = "https://i.imgur.com/lhhqACi.png";

    imageInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        resultContainer.innerHTML = "";
        processedImages = [];
        sendAllContainer.style.display = "none";
        status.innerText = `Processando ${files.length} imagem(ns)...`;

        for (let file of files) {
            await processAndDisplay(file);
        }

        status.innerText = "✅ Processamento concluído!";
        if(processedImages.length > 0) {
            sendAllContainer.style.display = "block";
            sendAllBtn.style.background = "#5865F2"; // Reseta cor se já tiver usado
            sendAllBtn.disabled = false;
            sendAllBtn.innerText = `ENVIAR TODAS (${processedImages.length}) AO DISCORD`;
        }
    });

    // Botão Único de Envio
    sendAllBtn.addEventListener('click', async () => {
        sendAllBtn.disabled = true;
        let total = processedImages.length;
        
        for(let i = 0; i < total; i++) {
            sendAllBtn.innerText = `ENVIANDO ${i+1} DE ${total}...`;
            const success = await uploadToWebhook(processedImages[i]);
            if (!success) {
                console.error("Falha no envio da imagem " + (i+1));
            }
        }
        
        sendAllBtn.innerText = "✅ TODAS ENVIADAS COM SUCESSO!";
        sendAllBtn.style.background = "#3ba55c";
    });

    async function uploadToWebhook(dataUrl) {
        try {
            const res = await fetch(dataUrl);
            const blob = await res.blob();
            const formData = new FormData();
            formData.append('file', blob, `cartaz_${Math.floor(Math.random()*99999)}.png`);

            const response = await fetch(DISCORD_WEBHOOK, {
                method: 'POST',
                body: formData
            });
            return response.ok;
        } catch (e) {
            return false;
        }
    }

    function processAndDisplay(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    // Lógica de aplicação da logo
                    const areaW = img.width * 0.45, areaH = img.height * 0.35, areaY = img.height * 0.65;
                    ctx.fillStyle = "#0c1a2e"; 
                    ctx.fillRect(0, areaY, areaW, areaH);

                    const logoWidth = img.width * 0.32; 
                    const scale = logoWidth / userLogo.width;
                    const logoHeight = userLogo.height * scale;
                    ctx.drawImage(userLogo, (areaW - logoWidth) / 2, img.height - logoHeight - 180, logoWidth, logoHeight);

                    const dataUrl = canvas.toDataURL("image/png");
                    processedImages.push(dataUrl);
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = "result-item";
                    itemDiv.innerHTML = `
                        <img src="${dataUrl}" class="output-img">
                        <a href="${dataUrl}" download="cartaz_inove.png" class="save-btn">BAIXAR ESTA IMAGEM</a>
                        <div class="hint">Dica: No iPhone, segure na imagem para salvar na galeria.</div>
                    `;
                    
                    resultContainer.appendChild(itemDiv);
                    resolve();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
